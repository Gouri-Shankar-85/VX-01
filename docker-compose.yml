name: vx01-laptop

services:

  vx01-sim:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
    image: vx01-sim:humble
    container_name: vx01-sim
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./vx01_ws/src:/vx01_ws/src
      - vx01_build_sim:/vx01_ws/build
      - vx01_install_sim:/vx01_ws/install
      - vx01_log_sim:/vx01_ws/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.ssh:/root/.ssh:ro
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
    command: bash

  vx01-hardware:
    profiles: ["hardware"]
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    image: vx01-base:humble
    container_name: vx01-hardware
    network_mode: host
    privileged: true
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./vx01_ws/src:/vx01_ws/src
      - vx01_build_hw:/vx01_ws/build
      - vx01_install_hw:/vx01_ws/install
      - vx01_log_hw:/vx01_ws/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.ssh:/root/.ssh:ro
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
      - /dev:/dev
    devices:
      - /dev/ttyPIXHAWK:/dev/ttyPIXHAWK
      - /dev/ttyMAESTRO:/dev/ttyMAESTRO
      - /dev/ttyTFMINI:/dev/ttyTFMINI
      - /dev/ttyIMU:/dev/ttyIMU
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/bus/usb:/dev/bus/usb
    command: bash

  vx01-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
    image: vx01-sim:humble
    container_name: vx01-dev
    network_mode: host
    privileged: true
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./vx01_ws/src:/vx01_ws/src
      - vx01_build_sim:/vx01_ws/build
      - vx01_install_sim:/vx01_ws/install
      - vx01_log_sim:/vx01_ws/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.ssh:/root/.ssh:ro
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
      - /dev:/dev
    command: bash

  vx01-rosbridge:
    profiles: ["dev", "hardware", "sim"]
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    image: vx01-base:humble
    container_name: vx01-rosbridge
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./vx01_ws/src:/vx01_ws/src
      - vx01_build_sim:/vx01_ws/build
      - vx01_install_sim:/vx01_ws/install
      - vx01_log_sim:/vx01_ws/log
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               [ -f /vx01_ws/install/setup.bash ] && source /vx01_ws/install/setup.bash;
               ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=9090"

  vx01-dashboard:
    profiles: ["dev", "hardware", "sim"]
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: vx01-dashboard:latest
    container_name: vx01-dashboard
    ports:
      - "5173:5173"

volumes:
  vx01_build_sim:
  vx01_install_sim:
  vx01_log_sim:
  vx01_build_hw:
  vx01_install_hw:
  vx01_log_hw: