name: Build Dashboard

on:
  push:
    branches: [ main ]
    paths:
      - 'vx01_dashboard/**'
      - '.github/workflows/build-dashboard.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Registry
        id: registry
        run: |
          source .env 2>/dev/null || echo "DOCKER_REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}" > .env
          echo "REGISTRY=$(cat .env | grep DOCKER_REGISTRY | cut -d'=' -f2)" >> $GITHUB_ENV

      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/vx01-dashboard:latest

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/vx01-dashboard-backend:latest
