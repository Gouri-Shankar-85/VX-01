# vx01_locomotion_control gait_config.yaml

tripod_walk_node:
  ros__parameters:
    use_sim_time: true

    # Robot kinematics (mm)
    L1: 60.55
    L2: 73.84
    L3: 112.16
    body_radius: 105.66      
    beta_angle: 0.7854        

    home_x: 223.03
    home_y: 0.0
    home_z: -72.82

    # Gait parameters
    step_length: 60.0          # mm — stride length, visible in sim
    step_height: 30.0          # mm — lift height
    step_period: 4.2           # s  — one full 6-block cycle (blocks=0.7s each)
    stand_duration: 3.0

    # Velocity scaling
    max_linear_vel: 0.15      # m/s
    max_angular_vel: 0.5      # rad/s

    # Trajectory waypoints per phase block
    trajectory_waypoints: 12

    # Joint names per leg (order: coxa, femur, tibia)
    leg_joint_names:
      "0": ["coxa_leg0_joint", "femur_leg0_joint", "tibia_leg0_joint"]
      "1": ["coxa_leg1_joint", "femur_leg1_joint", "tibia_leg1_joint"]
      "2": ["coxa_leg2_joint", "femur_leg2_joint", "tibia_leg2_joint"]
      "3": ["coxa_leg3_joint", "femur_leg3_joint", "tibia_leg3_joint"]
      "4": ["coxa_leg4_joint", "femur_leg4_joint", "tibia_leg4_joint"]
      "5": ["coxa_leg5_joint", "femur_leg5_joint", "tibia_leg5_joint"]

    # Controller action server names
    leg_controller_names:
      - "leg_0_controller"
      - "leg_1_controller"
      - "leg_2_controller"
      - "leg_3_controller"
      - "leg_4_controller"
      - "leg_5_controller"

    # TF frame names
    base_frame: "base_link"
    coxa_frames:
      - "coxa_link_0"
      - "coxa_link_1"
      - "coxa_link_2"
      - "coxa_link_3"
      - "coxa_link_4"
      - "coxa_link_5"


teleop_node:
  ros__parameters:
    use_sim_time: true
    linear_step: 0.02         # m/s increment per key press
    angular_step: 0.1         # rad/s increment per key press
    max_linear_vel: 0.15
    max_angular_vel: 0.5