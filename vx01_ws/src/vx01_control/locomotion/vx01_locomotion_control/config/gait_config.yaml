# vx01_locomotion_control gait_config.yaml

tripod_walk_node:
  ros__parameters:
    use_sim_time: true

    # Robot kinematics (mm)
    L1: 60.55
    L2: 73.84
    L3: 112.16
    body_radius: 105.66      
    beta_angle: 0.7854        

    # Robot geometry (all units: mm)
    # home_x is the neutral foot position along the coxa axis (leg-local X).
    # CRITICAL: home_x determines the workspace margin for walking.
    #   At home_x=223mm → only 8.7mm margin → 45° legs fail at step_length>17mm.
    #   At home_x=190mm → 32.3mm margin → all 6 legs handle step_length=30mm with
    #   full IK success including swing apex and full stride arc.
    home_x: 190.0
    home_y: 0.0
    home_z: -72.82

    # Gait parameters
    # step_length: total stride arc length (each half = 15mm).
    # At home_x=190mm: 45° legs hit workspace boundary at step_length≥76mm.
    # Swing apex uses Bézier control point P1z = home_z + 2*step_height.
    # Quadratic Bézier reaches midpoint = (P0+2*P1+P2)/4, so actual apex at t=0.5
    # is home_z + step_height (the 2× factor in P1z compensates the Bézier weighting).
    step_length: 30.0          # mm — safe for all 6 legs (max=76mm at home_x=190)
    step_height: 25.0          # mm — visible lift in sim
    step_period: 1.8           # s  — full cycle (0.9s per half-cycle)
    stand_duration: 2.0

    # Velocity scaling
    max_linear_vel: 0.15      # m/s — consistent with stride math
    max_angular_vel: 0.6      # rad/s

    # Trajectory waypoints per phase block
    trajectory_waypoints: 12

    # Joint names per leg (order: coxa, femur, tibia)
    leg_joint_names:
      "0": ["coxa_leg0_joint", "femur_leg0_joint", "tibia_leg0_joint"]
      "1": ["coxa_leg1_joint", "femur_leg1_joint", "tibia_leg1_joint"]
      "2": ["coxa_leg2_joint", "femur_leg2_joint", "tibia_leg2_joint"]
      "3": ["coxa_leg3_joint", "femur_leg3_joint", "tibia_leg3_joint"]
      "4": ["coxa_leg4_joint", "femur_leg4_joint", "tibia_leg4_joint"]
      "5": ["coxa_leg5_joint", "femur_leg5_joint", "tibia_leg5_joint"]

    # Controller action server names
    leg_controller_names:
      - "leg_0_controller"
      - "leg_1_controller"
      - "leg_2_controller"
      - "leg_3_controller"
      - "leg_4_controller"
      - "leg_5_controller"

    # TF frame names
    base_frame: "base_link"
    coxa_frames:
      - "coxa_link_0"
      - "coxa_link_1"
      - "coxa_link_2"
      - "coxa_link_3"
      - "coxa_link_4"
      - "coxa_link_5"


teleop_node:
  ros__parameters:
    use_sim_time: true
    linear_step: 0.02         # m/s increment per key press
    angular_step: 0.1         # rad/s increment per key press
    max_linear_vel: 0.15
    max_angular_vel: 0.5