# vx01_locomotion_control gait_config.yaml

tripod_walk_node:
  ros__parameters:
    use_sim_time: true

    # Robot kinematics (mm)
    L1: 60.55
    L2: 73.84
    L3: 112.16
    body_radius: 105.66      
    beta_angle: 0.7854        

    # Robot geometry (all units: mm)
    # home_x: neutral foot position along coxa axis (leg-local X)
    # Tripod gait workspace check: all 6 legs must succeed IK at all swing points
    home_x: 227.689
    home_y: 0.0
    home_z: -61.379

    # Gait parameters — CRITICAL: Tripod = 6 BLOCKS per cycle
    # block_period = step_period / 6.0
    # Each block = half-cycle: 3 legs swing, 3 legs drag
    # step_length: verified safe stride (mm)
    # step_height: lift above ground (mm)
    # step_period: FULL cycle for 6 blocks (3.0s = 0.5s per block)
    step_length: 60.0          # mm — workspace verified
    step_height: 35.0          # mm — clearly visible in sim
    step_period: 3.0           # s  — 6 blocks × 0.5s = 3.0s full cycle
    stand_duration: 3.0

    # Velocity scaling
    max_linear_vel: 0.20      # m/s — consistent with stride math
    max_angular_vel: 0.6      # rad/s

    # Trajectory waypoints per phase block
    trajectory_waypoints: 12

    # Joint names per leg (order: coxa, femur, tibia)
    leg_joint_names:
      "0": ["coxa_leg0_joint", "femur_leg0_joint", "tibia_leg0_joint"]
      "1": ["coxa_leg1_joint", "femur_leg1_joint", "tibia_leg1_joint"]
      "2": ["coxa_leg2_joint", "femur_leg2_joint", "tibia_leg2_joint"]
      "3": ["coxa_leg3_joint", "femur_leg3_joint", "tibia_leg3_joint"]
      "4": ["coxa_leg4_joint", "femur_leg4_joint", "tibia_leg4_joint"]
      "5": ["coxa_leg5_joint", "femur_leg5_joint", "tibia_leg5_joint"]

    # Controller action server names
    leg_controller_names:
      - "leg_0_controller"
      - "leg_1_controller"
      - "leg_2_controller"
      - "leg_3_controller"
      - "leg_4_controller"
      - "leg_5_controller"

    # TF frame names
    base_frame: "base_link"
    coxa_frames:
      - "coxa_link_0"
      - "coxa_link_1"
      - "coxa_link_2"
      - "coxa_link_3"
      - "coxa_link_4"
      - "coxa_link_5"


teleop_node:
  ros__parameters:
    use_sim_time: true
    linear_step: 0.02         # m/s increment per key press
    angular_step: 0.1         # rad/s increment per key press
    max_linear_vel: 0.15
    max_angular_vel: 0.5