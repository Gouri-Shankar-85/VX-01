hexapod_forward_walk_node:
  ros__parameters:
    use_sim_time: false

    L1: 60.55
    L2: 73.84
    L3: 112.16
    body_radius: 100.0
    beta_angle: 1.0977

    home_x: 227.689
    home_y: 0.0
    home_z: -61.379

    step_length: 60.0       # Reduced from 120mm to stay in workspace
    step_height:  35.0      # Reduced from 40mm for safer operation
    step_period:   3.0      # Increased for 6-block tripod gait

    standby_coxa:   0.0
    standby_femur: -0.7156
    standby_tibia:  0.6000
    standby_duration: 5.0

    update_rate: 50.0

    leg_controllers:
      - leg_0_controller
      - leg_1_controller
      - leg_2_controller
      - leg_3_controller
      - leg_4_controller
      - leg_5_controller

hexapod_turn_node:
  ros__parameters:
    use_sim_time: false

    L1: 60.55
    L2: 73.84
    L3: 112.16
    body_radius: 100.0
    beta_angle: 1.0977

    home_x: 227.689
    home_y: 0.0
    home_z: -61.379

    step_length: 60.0       # Reduced from 120mm to stay in workspace
    step_height:  35.0      # Reduced from 40mm for safer operation
    step_period:   3.0      # Increased for 6-block tripod gait

    standby_coxa:   0.0
    standby_femur: -0.7156
    standby_tibia:  0.6000
    standby_duration: 5.0

    update_rate: 50.0

    # +1 = counter-clockwise 
    # -1 = clockwise         
    turn_direction: 1

    leg_controllers:
      - leg_0_controller
      - leg_1_controller
      - leg_2_controller
      - leg_3_controller
      - leg_4_controller
      - leg_5_controller