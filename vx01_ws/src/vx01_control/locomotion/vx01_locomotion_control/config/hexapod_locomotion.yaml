hexapod_locomotion_node:
  ros__parameters:
    use_sim_time: false        

    # Robot geometry (mm / rad)
    L1: 60.55
    L2: 73.84
    L3: 112.16
    body_radius: 100.0
    beta_angle: 1.0977

    # Home foot position
    home_x: 220.0
    home_y: 0.0
    home_z: -60.0       

    # Gait parameters
    step_length: 30.0    
    step_height: 22.0
    step_period: 2.4           

    standby_coxa:  0.0
    standby_femur: -0.62
    standby_tibia: 0.3

    standby_duration: 5.0

    update_rate: 50.0

    leg_controllers:
      - leg_0_controller
      - leg_1_controller
      - leg_2_controller
      - leg_3_controller
      - leg_4_controller
      - leg_5_controller