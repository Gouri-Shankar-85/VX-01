locomotion_node:
  ros__parameters:
    use_sim_time: true

    # ── Kinematic link lengths (mm) — from leg.JPG CAD drawing ──────────────
    L1: 60.55     # COXA  length (mm)
    L2: 73.84     # FEMUR length (mm)
    L3: 112.16    # TIBIA length (mm)

    # ── Body geometry ─────────────────────────────────────────────────────────
    # Distance from body centre to the coxa pivot (mm).
    # Check with: ros2 run tf2_ros tf2_echo base_link coxa_leg0_joint
    # Use the XY distance from the output translation.
    body_radius: 50.0

    # ── Gait parameters — from bezier_curve.JPG engineering drawing ──────────
    step_length: 110.0    # T – stride length per cycle (mm)
    step_height:  22.78   # A – peak foot lift height   (mm)
    step_period:   2.0    # full 6-block tripod cycle   (s)

    # ── Home foot position in the leg-local frame (mm) ───────────────────────
    # Derived from the URDF desired stand pose:
    #   coxa = 0.0 rad, femur = -0.785 rad (-45 deg), tibia = +0.600 rad (+34 deg)
    # Forward kinematics of those URDF angles gives:
    #   x = 223.03 mm,  z = -72.82 mm
    # IMPORTANT: if you change these, also retune femur_urdf_offset.
    home_x: 223.03
    home_y:   0.0
    home_z: -72.82

    # ── DH → URDF joint angle conversion ─────────────────────────────────────
    # The IK library produces DH angles which differ from URDF commanded angles.
    # Conversion rules applied in publish_leg_trajectory():
    #
    #   URDF coxa  = -dh_theta1                        (axis sign flip)
    #   URDF femur =  dh_theta2 + femur_urdf_offset    (zero offset)
    #   URDF tibia = -dh_theta3                        (axis sign flip)
    #
    # Derivation of femur_urdf_offset:
    #   IK at home (223.03, 0, -72.82) → DH theta2 = -0.0577 rad
    #   URDF wants femur = -0.785 rad at home.
    #   offset = -0.785 - (-0.0577) = -0.7273 rad
    #
    # Verified: at home position the node will command:
    #   coxa=0.000  femur=-0.785  tibia=+0.600  ← exactly your target
    femur_urdf_offset: -0.7273

    # ── Control loop ─────────────────────────────────────────────────────────
    update_rate_hz: 50.0   # Hz
    traj_dt:         0.02  # s — time_from_start per gait waypoint (= 1/50)
    stand_traj_dt:   0.08  # s — time_from_start during stand-up interpolation

    # ── Stand-up sequence ─────────────────────────────────────────────────────
    # Total stand-up time = standup_steps * stand_traj_dt = 40 * 0.08 = 3.2 s
    standup_steps: 40