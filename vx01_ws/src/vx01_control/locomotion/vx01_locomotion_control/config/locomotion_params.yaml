locomotion_node:
  ros__parameters:
    use_sim_time: true

    # ── Kinematic link lengths (mm) ──────────────────────────────────────────
    L1: 60.55    # COXA
    L2: 73.84    # FEMUR
    L3: 112.16   # TIBIA

    step_length:  20.0    # T – stride length (mm)  ← tuned for this home pos
    step_height:  15.0    # A – foot lift (mm)       ← conservative lift
    step_period:   2.0    # s – full 6-block cycle

    # ── Home foot position (leg-local frame, mm) ─────────────────────────────
    home_x: 223.03
    home_y:   0.0
    home_z: -72.82

    # ── Control loop ─────────────────────────────────────────────────────────
    update_rate_hz:  50.0   # Hz
    traj_dt:          0.02  # s – time_from_start per gait waypoint
    stand_traj_dt:    0.08  # s – per-step duration during stand-up interpolation

    # ── Stand-up sequence ─────────────────────────────────────────────────────
    standup_steps: 40